limit_req_zone $binary_remote_addr zone=novel_sync:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=novel_connections:10m;

server {
    listen 80 default_server;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 403; }
}

server {
    listen 443 ssl http2 default_server;
    server_name _;
    ssl_certificate /etc/letsencrypt/live/novel-sync/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/novel-sync/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:novel_tls:10m;
    ssl_session_timeout 1d;
    server_tokens off;
    client_max_body_size 64m;
    client_body_timeout 60s;
    limit_conn novel_connections 4;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location /v1/ {
        limit_req zone=novel_sync burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_hide_header Server;
        proxy_buffering off;
    }
    location / { return 404; }
}
